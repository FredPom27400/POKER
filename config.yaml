# Généré/mis à jour par calibrate.py. Les clés absentes prennent les valeurs
# par défaut de poker_assistant/config.py.
claude:
  model: claude-opus-5-5     # ex. claude-sonnet-5-5 ou claude-haiku-5-5 pour plus de vitesse / moins cher
  speed: fast               # mode rapide d'Opus 5.5 : même modèle, sortie ~2,5x plus rapide, prix x2 (normal pour désactiver)
  effort: low                # low | medium | high : low = réponse la plus rapide
  max_tokens: 4000
  timeout: 30                # secondes par requête
  max_retries: 2             # retries automatiques du SDK (429, 5xx, réseau)
  refusal_fallback: true     # repli serveur automatique si le modèle refuse
  max_image_width: 1600      # la capture est réduite au-delà
capture:
  monitor: 1                 # 1 = écran principal
  region: {x: 0, y: 0, width: 1280, height: 720}   # relative à l'écran
  interval: 0.5              # secondes entre deux captures
action_bar: {x: 0.45, y: 0.88, width: 0.55, height: 0.12}  # fractions de la table
detection:
  method: hybrid             # color | template | hybrid
  red_ratio_min: 0.08
  min_buttons: 2
  min_button_area: 0.01
  red_hue_low: 10
  red_hue_high: 165
  red_sat_min: 100
  red_val_min: 80
  template_turn: templates/turn_bar.png
  template_wait: templates/wait_bar.png
  template_min_score: 0.35
  stable_frames: 2
  fast_turn_end: true
dedupe:
  change_ratio: 0.002
  pixel_delta: 25
  recall_on_table_change: true
  recall_on_layout: true
  recall_stable_frames: 2
  blink_frames: 2
  max_calls_per_turn: 3
  min_seconds_between_calls: 2.0
  max_retries_per_turn: 2
  retry_delay: 3.0
ui:
  enabled: true
  hotkey: <ctrl>+<alt>+p
  geometry: +20+20
  font_size: 12
  opacity: 0.93
logging:
  dir: logs
